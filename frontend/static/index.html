<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="URUÁ-T: Sistema de monitoramento de embarcações fluviais em tempo real na Amazônia — Oriximiná (PA)." />
  <title>URUÁ-T · Monitoramento de Embarcações</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Leaflet 1.9.4 (CDN com integrity) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav id="navbar" aria-label="Barra principal">
    <div class="nav-brand">
      <button id="menu-btn" aria-label="Abrir menu de embarcações" aria-expanded="false">☰</button>
      <div class="nav-logo" aria-hidden="true">⚓</div>
      <div>
        <div class="nav-title">URUÁ-T</div>
        <div class="nav-subtitle">Oriximiná · Amazônia</div>
      </div>
    </div>

    <div id="live-badge" role="status" aria-live="polite">
      <div class="pulse-dot" id="pulse-dot"></div>
      <span id="live-label">Ao vivo</span>
      &nbsp;·&nbsp;
      <span id="countdown">5s</span>
      <span class="badge-simulado" title="Posições geradas por simulação, não por GPS real">SIMULADO</span>
    </div>

    <div class="nav-right">
      <div id="vessel-count">Embarcações: <span id="total-count">—</span></div>
    </div>
  </nav>

  <!-- LAYOUT -->
  <div id="layout">

    <!-- SIDEBAR -->
    <aside id="sidebar" aria-label="Lista de embarcações">
      <div class="sidebar-header">
        <div class="sidebar-title">Embarcações</div>
        <div id="filters" role="group" aria-label="Filtrar por tipo">
          <button class="filter-btn active" data-filter="todos" id="f-todos">Todos</button>
          <button class="filter-btn" data-filter="Transporte" id="f-transporte">Transporte</button>
          <button class="filter-btn" data-filter="Turismo" id="f-turismo">Turismo</button>
          <button class="filter-btn" data-filter="Pesca" id="f-pesca">Pesca</button>
          <button class="filter-btn" data-filter="Carga" id="f-carga">Carga</button>
        </div>
      </div>
      <div id="vessel-list" aria-live="polite">
        <!-- skeleton inicial enquanto a primeira resposta da API não chega -->
        <div class="skeleton-card" aria-hidden="true"><div class="skeleton-line w-70"></div><div class="skeleton-line w-40"></div></div>
        <div class="skeleton-card" aria-hidden="true"><div class="skeleton-line w-70"></div><div class="skeleton-line w-40"></div></div>
      </div>
    </aside>

    <!-- MAP -->
    <div id="map" role="application" aria-label="Mapa de posições das embarcações"></div>
  </div>

  <!-- TOASTS -->
  <div id="toast-container" aria-live="assertive"></div>

  <!-- Camadas isoladas: config → api → mapa → ui → app
       (trocar polling por WebSocket/SSE afeta apenas api.js) -->
  <script src="/static/js/config.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/mapa.js"></script>
  <script src="/static/js/ui.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
